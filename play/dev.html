<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Proxy</title>
<style>
  :root { --ink:#1c2733; --muted:#5d6b7a; --line:#cfd6de; --bg:#eef1f4; --panel:#fff; --accent:#0f766e; --bad:#b42318; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 8px; padding: 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  input[type=text], input[type=url], input[type=password] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #url { flex: 1; min-width: 0; }
  button { font: inherit; padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  details { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 10px; }
  summary { cursor: pointer; color: var(--muted); }
  .settings { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-top: 8px; }
  .settings label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
  .settings .wide { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #status { padding: 6px 10px; font-size: 13px; color: var(--muted); min-height: 30px; }
  #status.error { color: var(--bad); }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  @media (max-width: 600px) { .settings { grid-template-columns: 1fr; } header { flex-wrap: wrap; } }
</style>
</head>
<body>
<details id="setup">
  <summary>Connection settings</summary>
  <div class="settings">
    <label>Home PC address
      <input type="url" id="endpoint" placeholder="https://proxy.example.com" autocomplete="off">
    </label>
    <label>Access token
      <input type="password" id="token" autocomplete="off">
    </label>
    <div class="wide">
      <label style="display:flex;gap:6px;align-items:center;flex-direction:row">
        <input type="checkbox" id="scripts"> Run the page's own scripts (less safe, fewer broken sites)
      </label>
      <button type="button" id="save">Save settings</button>
      <button type="button" id="clear">Forget saved settings</button>
    </div>
  </div>
</details>

<header>
  <button type="button" id="back" disabled aria-label="Back">Back</button>
  <input type="text" id="url" placeholder="Enter a web address or search term" autocomplete="off" aria-label="Web address">
  <button type="button" class="go" id="go">Open</button>
</header>
<div id="status" role="status">Ready.</div>
<iframe id="frame" title="Proxied page" sandbox="allow-scripts"></iframe>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var history = [];

  function load(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
  function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  function wipe() { try { localStorage.removeItem('hp_endpoint'); localStorage.removeItem('hp_token'); localStorage.removeItem('hp_scripts'); } catch (e) {} }

  $('endpoint').value = load('hp_endpoint');
  $('token').value = load('hp_token');
  $('scripts').checked = load('hp_scripts') === '1';
  if (!$('endpoint').value || !$('token').value) $('setup').open = true;

  function setStatus(msg, isError) { $('status').textContent = msg; $('status').className = isError ? 'error' : ''; }

  $('save').onclick = function () {
    store('hp_endpoint', $('endpoint').value.trim().replace(/\/+$/, ''));
    store('hp_token', $('token').value);
    store('hp_scripts', $('scripts').checked ? '1' : '0');
    setStatus('Settings saved in this browser.');
  };
  $('clear').onclick = function () {
    wipe(); $('endpoint').value = ''; $('token').value = ''; $('scripts').checked = false;
    setStatus('Saved settings removed.');
  };

  // Script injected into the page so link clicks and form submits come back here.
  var BRIDGE = '<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;e.preventDefault();parent.postMessage({hpGo:a.href},"*")},true);' +
    'document.addEventListener("submit",function(e){var f=e.target;if((f.method||"get").toLowerCase()!=="get")return;e.preventDefault();var u=new URL(f.action||location.href);new FormData(f).forEach(function(v,k){if(typeof v==="string")u.searchParams.set(k,v)});parent.postMessage({hpGo:u.href},"*")},true);<\/script>';

  function normalize(input) {
    var v = input.trim();
    if (!v) return '';
    if (/^https?:\/\//i.test(v)) return v;
    if (/^[^\s]+\.[^\s]{2,}$/.test(v)) return 'https://' + v;
    return 'https://duckduckgo.com/html/?q=' + encodeURIComponent(v);
  }

  function render(data) {
    var html = data.html;
    if (!$('scripts').checked) html = html.replace(/<script\b[\s\S]*?<\/script\s*>/gi, '');
    var base = '<base href="' + data.url.replace(/"/g, '&quot;') + '">';
    $('frame').srcdoc = base + BRIDGE + html;
  }

  function open(target, skipHistory) {
    var endpoint = load('hp_endpoint'), token = load('hp_token');
    if (!endpoint || !token) { $('setup').open = true; setStatus('Add your home PC address and token first, then save.', true); return; }
    var url = normalize(target);
    if (!url) return;
    $('go').disabled = true;
    setStatus('Loading ' + url + ' …');
    fetch(endpoint + '/fetch?url=' + encodeURIComponent(url), { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.body.error || 'Request failed.');
        if (!skipHistory) history.push(res.body.url);
        $('url').value = res.body.url;
        $('back').disabled = history.length < 2;
        render(res.body);
        setStatus('Loaded (status ' + res.body.status + ').');
      })
      .catch(function (err) {
        setStatus(err.message === 'Failed to fetch'
          ? 'Could not reach your home PC. Check that the server is running, the address is right, and it uses https.'
          : err.message, true);
      })
      .then(function () { $('go').disabled = false; });
  }

  $('go').onclick = function () { open($('url').value); };
  $('url').onkeydown = function (e) { if (e.key === 'Enter') open($('url').value); };
  $('back').onclick = function () { history.pop(); var prev = history[history.length - 1]; if (prev) open(prev, true); };

  window.addEventListener('message', function (e) {
    if (e.source !== $('frame').contentWindow || !e.data || typeof e.data.hpGo !== 'string') return;
    if (/^https?:\/\//i.test(e.data.hpGo)) open(e.data.hpGo);
  });
})();
</script>
</body>
</html>
