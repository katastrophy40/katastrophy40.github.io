<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play</title>
<style>
  :root{
    --bg:#0c0b14; --panel:#16142a; --text:#f1efff; --muted:#8c88b3; --accent:#7c5cff; --accent2:#22d3ee;
  }
  *{box-sizing:border-box;margin:0}
  body{background:radial-gradient(1200px 600px at 20% -10%,#241b4d 0%,transparent 60%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
  header{padding:48px 24px 16px;max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
  h1{font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.03em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);margin-top:4px}
  input[type=search]{background:var(--panel);border:1px solid #2a2750;color:var(--text);padding:12px 16px;border-radius:12px;font-size:1rem;width:min(320px,100%);outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  main{max-width:1100px;margin:0 auto;padding:16px 24px 64px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid #25224a;border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0;transition:transform .15s,border-color .15s,box-shadow .15s}
  .card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 30px -10px rgba(124,92,255,.5);outline:none}
  .thumb{aspect-ratio:16/10;display:grid;place-items:center;font-size:3.2rem;font-weight:800;color:rgba(255,255,255,.92);text-shadow:0 4px 20px rgba(0,0,0,.35)}
  .meta{padding:12px 14px 14px}
  .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file{color:var(--muted);font-size:.8rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{border:1px dashed #36326a;border-radius:16px;padding:32px;color:var(--muted);line-height:1.6}
  .empty code{background:#1f1c3d;color:var(--accent2);padding:2px 6px;border-radius:6px}
  .empty ol{margin:12px 0 0 20px}
  #stage{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10}
  #stage.open{display:flex}
  .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0e0c1f;border-bottom:1px solid #25224a}
  .bar .title{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar button,.bar a{background:var(--panel);color:var(--text);border:1px solid #2a2750;border-radius:10px;padding:8px 12px;font:inherit;font-size:.9rem;cursor:pointer;text-decoration:none}
  .bar button:hover,.bar a:hover{border-color:var(--accent)}
  iframe{flex:1;border:0;width:100%;background:#fff}
</style>
</head>
<body>
<header>
  <div>
    <h1>Play</h1>
    <p class="sub" id="count">Loading…</p>
  </div>
  <input type="search" id="q" placeholder="Search…" aria-label="Search">
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</main>

<div id="stage" role="dialog" aria-modal="true">
  <div class="bar">
    <span class="title" id="stageTitle"></span>
    <button id="fs" title="Full screen">⛶ Full screen</button>
    <a id="pop" target="_blank" rel="noopener">Open in tab ↗</a>
    <button id="close">✕ Close</button>
  </div>
  <iframe id="frame" allow="fullscreen; autoplay; clipboard-write" allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-popups allow-modals"></iframe>
</div>

<script>
const FOLDER = 'play/';
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const count = document.getElementById('count');
const q = document.getElementById('q');
const stage = document.getElementById('stage');
const frame = document.getElementById('frame');
let items = [];

const pretty = f => f.replace(/\.html?$/i,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim()
  .replace(/\b\w/g, c => c.toUpperCase());

function hue(s){ let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h%360; }

// 1) Try the folder's own directory listing (works on most simple servers)
async function fromListing(){
  const r = await fetch(FOLDER, {cache:'no-store'});
  if(!r.ok) throw 0;
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
  const files = [...doc.querySelectorAll('a')]
    .map(a => decodeURIComponent((a.getAttribute('href')||'').split('?')[0].split('#')[0]))
    .map(h => h.split('/').pop())
    .filter(h => /\.html?$/i.test(h) && h.toLowerCase() !== 'index.html');
  if(!files.length) throw 0;
  return [...new Set(files)];
}

// 2) Fallback: play/list.json — a plain array of file names
async function fromManifest(){
  const r = await fetch(FOLDER + 'list.json', {cache:'no-store'});
  if(!r.ok) throw 0;
  const data = await r.json();
  return data.map(x => typeof x === 'string' ? x : x.file).filter(Boolean);
}

async function load(){
  let files = [];
  try { files = await fromListing(); }
  catch { try { files = await fromManifest(); } catch {} }
  items = files.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))
               .map(f => ({file:f, name:pretty(f)}));
  render();
}

function render(){
  const term = q.value.trim().toLowerCase();
  const shown = items.filter(i => i.name.toLowerCase().includes(term));
  grid.innerHTML = '';
  count.textContent = items.length ? `${shown.length} of ${items.length} ready to play` : 'Nothing here yet';

  if(!items.length){
    empty.hidden = false;
    empty.innerHTML = `<strong style="color:var(--text)">The <code>play</code> folder is empty or can't be read.</strong>
      <ol>
        <li>Put your <code>.html</code> files inside a folder named <code>play</code>, next to this page.</li>
        <li>Serve the site with a local server, e.g. <code>python3 -m http.server</code>, then open <code>localhost:8000</code>.</li>
        <li>If your server hides folder listings, add <code>play/list.json</code> containing
            <code>["one.html","two.html"]</code>.</li>
      </ol>`;
    return;
  }
  empty.hidden = true;

  for(const it of shown){
    const h = hue(it.file);
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = `<div class="thumb" style="background:linear-gradient(135deg,hsl(${h} 70% 45%),hsl(${(h+50)%360} 75% 30%))"></div>
      <div class="meta"><div class="name"></div><div class="file"></div></div>`;
    b.querySelector('.thumb').textContent = it.name.charAt(0);
    b.querySelector('.name').textContent = it.name;
    b.querySelector('.file').textContent = it.file;
    b.onclick = () => open(it);
    grid.appendChild(b);
  }
}

function open(it){
  const url = FOLDER + encodeURIComponent(it.file);
  document.getElementById('stageTitle').textContent = it.name;
  document.getElementById('pop').href = url;
  frame.src = url;
  stage.classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(()=>frame.focus(), 50);
}
function closeStage(){
  stage.classList.remove('open');
  frame.src = 'about:blank';
  document.body.style.overflow = '';
}

document.getElementById('close').onclick = closeStage;
document.getElementById('fs').onclick = () => (frame.requestFullscreen||frame.webkitRequestFullscreen).call(frame);
addEventListener('keydown', e => { if(e.key==='Escape' && stage.classList.contains('open') && !document.fullscreenElement) closeStage(); });
q.addEventListener('input', render);

load();
</script>
</body>
</html>
