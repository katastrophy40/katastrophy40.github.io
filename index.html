<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Secret Zone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="main-container">
    <!-- Hidden Door 1 -->
    <div class="hidden-door door-1" onclick="openDoor(1)">
      <div class="door-text">?</div>
    </div>

    <!-- Hidden Door 2 -->
    <div class="hidden-door door-2" onclick="openDoor(2)">
      <div class="door-text">KNOCK</div>
    </div>

    <!-- Hidden Door 3 -->
    <div class="hidden-door door-3" onclick="openDoor(3)">
      <div class="door-text">ENTER</div>
    </div>

    <!-- Bucket 1 -->
    <div class="bucket bucket-1" onclick="shakeBucket(1)">
      🪣
    </div>

    <!-- Bucket 2 -->
    <div class="bucket bucket-2" onclick="shakeBucket(2)">
      🪣
    </div>

    <!-- Clone 1 -->
    <div class="clone clone-1" onclick="cloneReact(1)">
      👤
    </div>

    <!-- Clone 2 -->
    <div class="clone clone-2" onclick="cloneReact(2)">
      👤
    </div>

    <!-- Clone 3 -->
    <div class="clone clone-3" onclick="cloneReact(3)">
      👤
    </div>

    <!-- Weird Al Accordion -->
    <div class="weird-al-button" onclick="playAccordion()">
      🎵 WEIRD AL MODE 🎵
    </div>

    <!-- Chambers Ultimate -->
    <div class="chambers-ult" onclick="chambersUltimate()">
      ⚡ CHAMBERS ULT ⚡
    </div>

    <!-- Main Content Area -->
    <div class="center-content">
      <h1>Welcome to the Secret Zone</h1>
      <p>Click things. Explore. Weird things will happen.</p>
      <p style="font-size: 0.8rem; color: #888;">Doors • Buckets • Clones • Music • POWER</p>
    </div>
  </div>

  <!-- Modal for Door Content -->
  <div id="doorModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeDoor()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Weird Al Audio -->
  <audio id="weirdAlAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <!-- Chambers Ultimate Overlay -->
  <div id="chambersOverlay" class="chambers-overlay"></div>

  <script src="script.js"></script>
</body>
</html>
