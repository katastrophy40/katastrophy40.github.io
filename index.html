<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apps</title>
<style>
:root{--bg:#3e4852;--bar:#20272d;--barText:#dfe4e8;--win:#e4e7ea;--wtext:#1d2227;--accent:#c8372d;--accentText:#fff;--tile:#2b333a;--round:6px;--font:Bahnschrift,"DIN Alternate","Roboto Condensed","Segoe UI",Arial,sans-serif;--bh:48px;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--barText);font-family:var(--font)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
/* home list */
#home{max-width:640px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:26px;font-weight:600;flex:1;user-select:none;-webkit-user-select:none}
.hb{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:var(--round);padding:8px 14px}
.hb:hover{background:rgba(255,255,255,.08)}
#off{font-size:12px;opacity:.7}
#q{width:100%;padding:11px 14px;font:inherit;color:inherit;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.2);border-radius:var(--round);margin-bottom:12px}
#q::placeholder{color:rgba(255,255,255,.5)}
#list{border-top:1px solid rgba(255,255,255,.12)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 6px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}
.row:hover{background:rgba(255,255,255,.06)}
.row .t{width:44px;height:44px;flex:none;border-radius:var(--round);display:flex;align-items:center;justify-content:center;font:700 20px ui-monospace,Consolas,monospace;background:var(--tile);color:var(--accent);border:1px solid rgba(255,255,255,.15);overflow:hidden}
.row .t img{width:100%;height:100%;object-fit:cover}
.row .n{flex:1;font-size:calc(17px*var(--fs))}
.row .c{opacity:.5;font-size:22px}
.empty{padding:24px 6px;opacity:.7}
/* fullscreen app view */
#view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:10}
#view[hidden]{display:none}
#vbody{flex:1;position:relative;min-height:0;overflow:auto}
#vbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#vbody.set{background:var(--win);color:var(--wtext);padding:20px 18px}
#bbar{display:flex;align-items:stretch;height:calc(var(--bh) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bar);color:var(--barText);border-top:1px solid rgba(255,255,255,.12)}
#bbar button{background:transparent;border:0;padding:0 14px;min-width:44px;font-size:14px}
#bbar button:hover{background:rgba(255,255,255,.08)}
#back{border-right:1px solid rgba(255,255,255,.12);font-weight:600}
#vt{flex:1;align-self:center;padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;opacity:.85;min-width:0}
#vol{display:flex;align-items:center}
#vol input{width:90px;accent-color:var(--accent);margin:0 8px 0 0}
/* settings controls */
.srow{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;font-size:14px;font-weight:600;max-width:420px}
.srow .top{display:flex;justify-content:space-between;opacity:.7}
.srow select{font:inherit;padding:9px 12px;border-radius:var(--round);border:1px solid rgba(0,0,0,.3);background:#fff;color:#222}
.srow input[type=range]{width:100%;accent-color:var(--bar)}
.btn{background:var(--bar);color:var(--barText);border:0;border-radius:var(--round);padding:10px 18px;font-weight:600}
/* look (dev appearance) */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#home{position:relative;z-index:1}
#home.wide{max-width:900px}
#scan{position:fixed;inset:0;pointer-events:none;z-index:9400;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
#scan[hidden]{display:none}
#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;border-top:0}
#list.grid .row{flex-direction:column;border:1px solid rgba(255,255,255,.14);border-radius:var(--round);padding:16px 8px;text-align:center;min-height:0}
#list.grid .row .t{width:64px;height:64px;font-size:28px}
#list.grid .row .c{display:none}
body.glow h1{text-shadow:0 0 14px var(--accent)}
body.glow .row .t{box-shadow:0 0 12px var(--accent)}
body.glow .row:hover{box-shadow:0 0 0 1px var(--accent)}
/* desktop home */
#home{max-width:none;margin:0;padding:env(safe-area-inset-top,0px) 0 calc(var(--barh) + env(safe-area-inset-bottom,0px));min-height:100%}
#home.plain{max-width:640px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(var(--barh) + 24px + env(safe-area-inset-bottom,0px))}
header.top{position:fixed;bottom:0;left:0;right:0;z-index:5;height:calc(var(--barh) + env(safe-area-inset-bottom,0px));padding:0 12px env(safe-area-inset-bottom,0px);margin:0;flex-wrap:nowrap;gap:8px;background:var(--barbg,var(--bar));color:var(--barText);border-top:1px solid rgba(255,255,255,.12)}
header.top h1{flex:0 0 auto;font-size:calc(14px*var(--fs));font-weight:700;letter-spacing:.2px}
.sp{flex:1}
.hb{padding:3px 10px;font-size:calc(13px*var(--fs))}
#q{width:150px;padding:4px 10px;margin:0;font-size:calc(13px*var(--fs))}
#clk{font-size:calc(14px*var(--fs));font-weight:600;font-variant-numeric:tabular-nums;opacity:.9;min-width:56px;text-align:right}
#list.desk{border-top:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,var(--rh));grid-auto-columns:var(--cw);justify-content:start;align-content:start;gap:var(--ig);padding:14px;height:calc(100vh - var(--barh) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));overflow-x:auto}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;width:var(--cw);padding:8px 4px;background:none;border:1px solid transparent;border-radius:var(--round);text-align:center;color:inherit;user-select:none;-webkit-user-select:none}
.ic .t{width:var(--isz);height:var(--isz);border-radius:var(--round);display:flex;align-items:center;justify-content:center;font:700 calc(var(--isz)*.46) ui-monospace,Consolas,monospace;background:var(--tile);color:var(--accent);border:1px solid rgba(255,255,255,.15);overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.ic .t img{width:100%;height:100%;object-fit:cover}
.ic .n{font-size:var(--lbl);line-height:1.25;overflow-wrap:anywhere}
.ic:hover{background:rgba(255,255,255,.07)}
.ic.sel{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35)}
#ctx{position:fixed;z-index:9600;min-width:170px;padding:4px;background:var(--bar);color:var(--barText);border:1px solid rgba(255,255,255,.2);border-radius:var(--round);box-shadow:0 8px 24px rgba(0,0,0,.45)}
#ctx[hidden]{display:none}
#ctx button{display:block;width:100%;text-align:left;padding:8px 12px;background:none;border:0;font-size:13px;border-radius:2px}
#ctx button:hover{background:rgba(255,255,255,.1)}
@media (max-width:700px){#list.desk{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));grid-auto-columns:auto;height:auto;overflow:visible}#q{width:100px}#off{display:none}}
/* settings-driven */
:root{--isz:56px;--cw:104px;--rh:108px;--ig:6px;--lbl:12.5px;--fs:1;--barh:36px}
body.nolabels .ic .n{display:none}
body.upper .ic .n{text-transform:uppercase}
body.noshadow .ic .t{box-shadow:none}
body.contrast .ic .t{border:2px solid var(--barText)}
body.contrast .ic .n,body.contrast #clk{font-weight:700}
body.rm *{animation:none!important;transition:none!important}
#list.desk.flowrow{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(auto-fill,var(--cw));grid-auto-columns:auto;height:auto}
body.bartop header.top{top:0;bottom:auto;padding:env(safe-area-inset-top,0px) 12px 0;height:calc(var(--barh) + env(safe-area-inset-top,0px));border-top:0;border-bottom:1px solid rgba(255,255,255,.12)}
body.bartop #home{padding:calc(var(--barh) + env(safe-area-inset-top,0px)) 0 0}
body.bartop #home.plain{padding:calc(var(--barh) + 20px + env(safe-area-inset-top,0px)) 16px 40px}
body.bartop #list.desk{height:calc(100vh - var(--barh) - env(safe-area-inset-top,0px))}
/* dashboard */
.dsec{margin:0 0 24px;max-width:620px}
.dsec h3{margin:0 0 10px;font-size:16px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;font-size:13px;overflow-wrap:anywhere}
.kv b{opacity:.7;font-weight:600}
.dbtns{display:flex;flex-wrap:wrap;gap:8px}
.dlog{margin-top:8px;font:12px ui-monospace,Consolas,monospace;background:rgba(0,0,0,.08);padding:8px;border-radius:var(--round);max-height:170px;overflow:auto;white-space:pre-wrap}
/* pin pad */
#pin{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9500}
#pin[hidden]{display:none}
.pbox{background:var(--win);color:var(--wtext);border-radius:var(--round);padding:22px;width:min(280px,calc(100% - 32px));text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.pbox p{margin:0;font-weight:600;min-height:1.3em}
.dots{display:flex;gap:12px;justify-content:center;margin:12px 0 16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--bar)}
.dots i.f{background:var(--bar)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{padding:14px 0;border-radius:var(--round);border:0;background:rgba(128,128,128,.2);color:inherit;font-size:18px;font-weight:600}
.keys button:hover{background:rgba(128,128,128,.35)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="scan" hidden></div>
<div id="home">
  <header class="top">
    <h1 id="ttl">Apps</h1>
    <div class="sp"></div>
    <span id="off" aria-live="polite"></span>
    <input id="q" type="search" placeholder="Search" aria-label="Search apps" autocomplete="off">
    <button class="hb" id="lock" hidden>Lock</button>
    <button class="hb" id="setb">Settings</button>
    <span id="clk"></span>
  </header>
  <div id="list"></div>
</div>
<div id="view" hidden>
  <div id="vbody"></div>
  <div id="bbar">
    <button id="back" aria-label="Back to list">&larr; Back</button>
    <div id="vt"></div>
    <div id="vol">
      <button id="mute">Mute</button>
      <input id="vr" type="range" min="0" max="100" aria-label="Volume">
    </div>
    <button id="fs" title="Fullscreen">Full</button>
    <button id="nt" title="Open in new tab">Tab</button>
  </div>
</div>
<script>
/* EDIT THIS LIST. name = label, path = link relative to this file, thumb = optional icon image */
const APPS = [
  { name: "App One",   path: "apps/app-one/index.html" },
  { name: "App Two",   path: "apps/app-two/index.html" },
  { name: "App Three", path: "apps/app-three/index.html", thumb: "" },
];

/* SECRET LIST: same format. Only shows after the PIN is entered (tap the "Apps" title 5 times). */
const SECRET_APPS = [
  { name: "Secret One", path: "secret/one/index.html" },
];
const PIN_HASH = "e2d5b613fb0c469dacec013794d08fcb584f06858f648de5e28c21bbce8eb695";

let secret = false;
const cur = () => secret ? [{name: "Dashboard", dash: true}, ...SECRET_APPS] : allApps();

const THEMES = {
  steel:   {bg:"#3e4852",win:"#e4e7ea",wtext:"#1d2227",bar:"#20272d",barText:"#dfe4e8",accent:"#c8372d",tile:"#2b333a"},
  concrete:{bg:"#7d8184",win:"#eeeeed",wtext:"#202224",bar:"#34383c",barText:"#ececec",accent:"#b3322a",tile:"#44484c"},
  olive:   {bg:"#4a4f3c",win:"#e5e6df",wtext:"#20231a",bar:"#262a1f",barText:"#e0e2d6",accent:"#bf3b30",tile:"#33372a"},
  navy:    {bg:"#2f3b4c",win:"#e3e7ed",wtext:"#18202b",bar:"#161d27",barText:"#dce3ec",accent:"#6fa8d6",tile:"#232d3b"},
  black:   {bg:"#232427",win:"#d9dadc",wtext:"#17181a",bar:"#0e0f10",barText:"#d5d6d8",accent:"#d63c32",tile:"#1b1c1f"},
  secret:  {bg:"#201718",win:"#dcd6d6",wtext:"#1a1414",bar:"#0b0808",barText:"#e6dede",accent:"#c0453a",tile:"#2a1d1e"}
};
const FONTS = [
  ['Bahnschrift,"DIN Alternate","Roboto Condensed","Segoe UI",Arial,sans-serif',"Industrial"],
  ['"Segoe UI",Tahoma,Verdana,sans-serif',"Classic"],
  ["system-ui,sans-serif","System"],
  ["ui-monospace,Menlo,Consolas,monospace","Mono"]
];
const LOOK_DEF = {custom:false,bg:"#111114",accent:"#c8372d",fx:"none",speed:1,density:100,bright:.7,scan:false,glow:false,cycle:false,layout:"desktop",title:"Apps"};
const DEF = {theme:"steel",round:6,font:FONTS[0][0],volume:1,autoOffline:true,showPaths:false,debug:false,newTab:false,
  openMode:"single",autoOpenLast:false,startMuted:false,lastApp:"",
  iconSize:56,gap:6,labels:true,labelSize:13,upper:false,letters:"1",sort:"custom",flow:"col",iconShadow:true,
  barPos:"bottom",barH:36,barOpacity:100,showSearch:true,showClock:true,clock24:false,clockSeconds:false,clockDate:false,showOffline:true,
  fontScale:100,contrast:false,reduceMotion:false,
  scanPlay:true,playFolder:"playables",playSub:true,autoIcons:true,scanTtl:15,repo:"katastrophy40/katastrophy40.github.io",branch:"main"};
const freshS = () => ({...DEF, look: {...LOOK_DEF}});
const sel = (k, label, o) => ({k, label, t: "select", o});
const rng = (k, label, min, max, step, unit = "", scale = 1) => ({k, label, t: "range", min, max, step, unit, scale});
const chk = (k, label, scan) => ({k, label, t: "check", scan});
const txt = (k, label, max, scan) => ({k, label, t: "text", max, scan});
const act = (label, fn) => ({t: "btn", label, fn});
const SECTIONS = [
  ["Opening apps", [
    sel("openMode", "Open apps with", [["single", "One click"], ["double", "Double click"]]),
    chk("newTab", "Open apps in a new tab"),
    chk("autoOpenLast", "Reopen the last app when the site loads"),
    chk("startMuted", "Start apps muted"),
    rng("volume", "Default volume", 0, 100, 1, "%", 100)]],
  ["Desktop icons", [
    sel("look.layout", "Home layout", [["desktop", "Desktop icons"], ["list", "Plain list"]]),
    rng("iconSize", "Icon size", 32, 120, 2, "px"), rng("gap", "Icon spacing", 0, 30, 1, "px"),
    chk("labels", "Show names under icons"), rng("labelSize", "Name text size", 10, 18, 1, "px"), chk("upper", "UPPERCASE names"),
    sel("letters", "Letters on icons", [["1", "One"], ["2", "Two"]]),
    sel("sort", "Sort order", [["custom", "As listed"], ["az", "A to Z"], ["za", "Z to A"]]),
    sel("flow", "Fill direction", [["col", "Down, then across"], ["row", "Across, then down"]]),
    chk("iconShadow", "Icon shadows")]],
  ["Taskbar", [
    sel("barPos", "Position", [["bottom", "Bottom"], ["top", "Top"]]), rng("barH", "Height", 28, 60, 1, "px"), rng("barOpacity", "Opacity", 40, 100, 5, "%"),
    chk("showSearch", "Show search box"), chk("showOffline", "Show offline status"), chk("showClock", "Show clock"),
    chk("clock24", "24-hour clock"), chk("clockSeconds", "Show seconds"), chk("clockDate", "Show date")]],
  ["Look", [
    sel("theme", "Color theme", [["steel", "Steel"], ["concrete", "Concrete"], ["olive", "Olive"], ["navy", "Navy"], ["black", "Black"]]),
    rng("round", "Corner roundness", 0, 20, 1, "px"), sel("font", "Text font", FONTS), rng("fontScale", "Text size", 80, 130, 5, "%"),
    chk("contrast", "High contrast"), chk("reduceMotion", "Reduce motion (stops wallpaper effects)"), txt("look.title", "Site title", 30)]],
  ["Playables folder", [
    chk("scanPlay", "Find HTML apps in the playables folder automatically", true), txt("playFolder", "Folder name", 40, true),
    chk("playSub", "Include folders that contain an index.html", true), chk("autoIcons", "Use matching images as icons", true),
    rng("scanTtl", "Check for changes at most every", 1, 120, 1, " min"), txt("repo", "Repository (owner/name)", 80, true), txt("branch", "Branch", 40, true),
    chk("autoOffline", "Save apps for offline automatically"), {t: "note"}, act("Scan now", () => scanPlayables(true))]],
  ["Data", [
    act("Copy settings", () => { try { navigator.clipboard.writeText(JSON.stringify(S, null, 2)); } catch (e) {} }),
    act("Import settings", () => { const t = prompt("Paste settings:"); if (!t) return; try { Object.assign(S, JSON.parse(t)); save(); location.reload(); } catch (e) { alert("That was not valid settings."); } }),
    act("Reset everything", () => { if (confirm("Reset every setting?")) { S = freshS(); save(); location.reload(); } })]]
];
const FLAT = SECTIONS.flatMap(x => x[1]).filter(c => c.k && !c.k.includes("."));
function clean(o) {   /* fixes any saved value that is missing or out of range */
  Object.keys(DEF).forEach(k => {
    const c = FLAT.find(x => x.k === k), d = DEF[k], v = o[k];
    if (c && c.t === "range") o[k] = (+v >= c.min / c.scale && +v <= c.max / c.scale) ? +v : d;
    else if (c && c.t === "select") o[k] = c.o.some(p => String(p[0]) === String(v)) ? String(v) : d;
    else if (c && c.t === "text") o[k] = (typeof v === "string" && v.trim()) ? v.trim().slice(0, c.max) : d;
    else if (typeof d === "boolean") o[k] = typeof v === "boolean" ? v : d;
    else if (typeof d === "string") o[k] = typeof v === "string" ? v : d;
  });
}

const KEY = "gs8-settings", $ = id => document.getElementById(id);
let S = freshS();
try { const j = localStorage.getItem(KEY); if (j) Object.assign(S, JSON.parse(j)); } catch (e) {}
clean(S);
{
  const L = {...LOOK_DEF, ...(S.look && typeof S.look === "object" ? S.look : {})}, hex = v => typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v);
  if (!hex(L.bg)) L.bg = LOOK_DEF.bg; if (!hex(L.accent)) L.accent = LOOK_DEF.accent;
  if (!["none", "grid", "rain", "snow", "stars", "aurora"].includes(L.fx)) L.fx = "none";
  if (!["desktop", "list"].includes(L.layout)) L.layout = "desktop";
  ["custom", "scan", "glow", "cycle"].forEach(k => L[k] = !!L[k]);
  [["speed", .2, 3], ["density", 20, 200], ["bright", .1, 1]].forEach(([k, a, b]) => { if (!(+L[k] >= a && +L[k] <= b)) L[k] = LOOK_DEF[k]; });
  L.title = typeof L.title === "string" ? L.title.slice(0, 30) : LOOK_DEF.title;
  S.look = L;
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const ink = h => { const n = parseInt(h.slice(1), 16); return ((n >> 16) * .299 + (n >> 8 & 255) * .587 + (n & 255) * .114) > 150 ? "#1a1a1a" : "#ffffff"; };

/* ---------- app list ---------- */
const q = $("q");
let lastPtr = "mouse", selEl = null;
addEventListener("pointerdown", e => { lastPtr = e.pointerType; }, true);
function renderList() {
  const f = q.value.trim().toLowerCase(), l = $("list"), desk = S.look.layout !== "list"; l.textContent = ""; selEl = null;
  const items = cur().filter(g => g.name.toLowerCase().includes(f));
  if (S.sort === "az") items.sort((x, y) => x.name.localeCompare(y.name)); else if (S.sort === "za") items.sort((x, y) => y.name.localeCompare(x.name));
  if (!items.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "No apps found."; l.appendChild(p); return; }
  items.forEach(g => {
    const b = document.createElement("button"); b.className = desk ? "ic" : "row";
    const t = document.createElement("div"); t.className = "t";
    if (g.thumb) { const im = document.createElement("img"); im.src = g.thumb; im.alt = ""; t.appendChild(im); } else { const lt = String(g.name).replace(/\s+/g, "").slice(0, +S.letters || 1); t.textContent = lt.charAt(0).toUpperCase() + lt.slice(1).toLowerCase(); }
    const n = document.createElement("div"); n.className = "n"; n.textContent = g.name;
    if (S.showPaths && g.path) { if (desk) b.title = g.path; else { const sm = document.createElement("small"); sm.style.cssText = "display:block;opacity:.6;font-size:12px"; sm.textContent = g.path; n.appendChild(sm); } }
    b.append(t, n);
    if (!desk) { const c = document.createElement("div"); c.className = "c"; c.textContent = "\u203A"; b.appendChild(c); }
    b.onclick = e => {   /* one click opens, unless "double click" is chosen in settings */
      if (desk && S.openMode === "double" && e.detail === 1 && lastPtr === "mouse") { if (selEl) selEl.classList.remove("sel"); selEl = b; b.classList.add("sel"); return; }
      openApp(g);
    };
    b.oncontextmenu = e => {
      e.preventDefault(); const m = [["Open", () => openApp(g)]]; if (g.path) m.push(["Open in new tab", () => window.open(g.path, "_blank")]);
      showCtx(e.clientX, e.clientY, m);
    };
    l.appendChild(b);
  });
}

    if (!S.debug) { dbgOn = false; dbg.hidden = true; return; }
    requestAnimationFrame(tick); fr++;
    if (t - ft >= 500) { dbg.hidden = false; dbg.textContent = Math.round(fr * 1000 / (t - ft)) + " fps  " + innerWidth + "x" + innerHeight + "  " + (navigator.onLine ? "online" : "offline") + (secret ? "  secret" : ""); fr = 0; ft = t; }
  })(performance.now());
}

function openDash() {
  showView("Dashboard", true);
  const box = document.createElement("div"); vbody.appendChild(box);
  const sec = title => { const d = document.createElement("div"); d.className = "dsec"; const h = document.createElement("h3"); h.textContent = title; d.appendChild(h); box.appendChild(d); return d; };
  const btn = (parent, label, fn) => { const b = document.createElement("button"); b.className = "btn"; b.textContent = label; b.onclick = fn; parent.appendChild(b); return b; };
  const note = document.createElement("p"); note.style.cssText = "font-size:13px;opacity:.75;max-width:620px;margin:0 0 20px";
  note.textContent = "Everything here applies to this browser only. A static site has no server, so nothing here changes the site for other people."; box.appendChild(note);

  const ap = sec("Appearance (this device)"), apBody = document.createElement("div"); ap.appendChild(apBody);
  const PRESETS = {
    Matrix:  {custom: true, bg: "#020a04", accent: "#00ff66", fx: "rain", scan: true, glow: true},
    Cyber:   {custom: true, bg: "#0d0b1f", accent: "#00e5ff", fx: "aurora", glow: true, bright: .6},
    Frost:   {custom: true, bg: "#0f2236", accent: "#9fd8ff", fx: "snow"},
    Crimson: {custom: true, bg: "#140506", accent: "#ff2a2a", fx: "grid", scan: true, glow: true},
    Rainbow: {custom: true, bg: "#111114", accent: "#ff3d9a", fx: "stars", cycle: true, glow: true}
  };
  const buildLook = () => {
    apBody.textContent = ""; const L = S.look;
    const pr = document.createElement("div"); pr.className = "dbtns"; pr.style.marginBottom = "14px"; apBody.appendChild(pr);
    Object.entries(PRESETS).forEach(([n, p]) => btn(pr, n, () => { S.look = {...LOOK_DEF, title: L.title, ...p}; save(); apply(); buildLook(); }));
    btn(pr, "Default look", () => { S.look = {...LOOK_DEF}; save(); apply(); buildLook(); });
    const add = (key, label, type, a, b, step) => {
      const d = document.createElement("div"); d.className = "srow"; const id = "lk-" + key;
      const lab = document.createElement("label"); lab.htmlFor = id; lab.textContent = label;
      let inp;
      if (type === "select") { inp = document.createElement("select"); a.forEach(([v, t]) => inp.add(new Option(t, v))); inp.value = L[key]; }
      else {
        inp = document.createElement("input"); inp.type = type;
        if (type === "range") { inp.min = a; inp.max = b; inp.step = step; inp.value = L[key]; }
        else if (type === "checkbox") inp.checked = L[key]; else inp.value = L[key];
        if (type === "text") { inp.maxLength = 30; inp.style.cssText = "font:inherit;padding:9px 12px;border-radius:var(--round);border:1px solid rgba(0,0,0,.3)"; }
      }
      inp.id = id;
      if (type === "checkbox") { d.style.cssText = "flex-direction:row;align-items:center;gap:10px"; d.append(inp, lab); } else d.append(lab, inp);
      inp.addEventListener("input", () => { S.look[key] = type === "checkbox" ? inp.checked : type === "range" ? +inp.value : inp.value; save(); apply(); });
      apBody.appendChild(d);
    };
    add("custom", "Use custom colors", "checkbox"); add("bg", "Background color", "color"); add("accent", "Accent color", "color");
    add("fx", "Wallpaper effect", "select", [["none", "None"], ["grid", "Grid"], ["rain", "Code rain"], ["snow", "Snow"], ["stars", "Starfield"], ["aurora", "Aurora glow"]]);
    add("speed", "Effect speed", "range", .2, 3, .1); add("density", "Effect amount", "range", 20, 200, 10); add("bright", "Effect strength", "range", .1, 1, .05);
    add("scan", "Scanlines", "checkbox"); add("glow", "Neon glow", "checkbox"); add("cycle", "Cycling accent color", "checkbox");
    add("layout", "Home layout", "select", [["desktop", "Desktop icons"], ["list", "Plain list"]]); add("title", "Site title", "text");
  };
  buildLook();

  const st = sec("Status"), kv = document.createElement("div"); kv.className = "kv"; st.appendChild(kv);
  const row = (k, v) => { const b = document.createElement("b"), s = document.createElement("span"); b.textContent = k; s.textContent = v; kv.append(b, s); return s; };
  row("Address", location.href); row("Secure (https)", window.isSecureContext ? "yes" : "no"); row("Online", navigator.onLine ? "yes" : "no");
  row("Window", innerWidth + " x " + innerHeight + " @" + devicePixelRatio + "x"); row("Apps", APPS.length + " listed, " + found.length + " found, " + SECRET_APPS.length + " secret");
  row("Browser", navigator.userAgent.slice(0, 90));
  const swEl = row("Offline worker", "checking..."), caEl = row("Offline copies", "checking..."), stEl = row("Storage used", "checking...");
  const refresh = async () => {
    try { const r = await navigator.serviceWorker.getRegistration(); swEl.textContent = r ? (r.active ? "active" : "installing") : "not registered"; } catch (e) { swEl.textContent = "unavailable"; }
    try { let n = 0; for (const k of await caches.keys()) n += (await (await caches.open(k)).keys()).length; caEl.textContent = n + " files saved"; } catch (e) { caEl.textContent = "unavailable"; }
    try { const e = await navigator.storage.estimate(); stEl.textContent = (e.usage / 1048576).toFixed(1) + " MB of " + Math.round(e.quota / 1048576) + " MB"; } catch (e) { stEl.textContent = "unavailable"; }
  };
  refresh();

  const dv = sec("Developer options");
  [["autoOffline", "Save apps for offline automatically"], ["showPaths", "Show file paths in the app list"], ["debug", "Debug overlay (fps, window size)"], ["newTab", "Open apps in a new tab instead of fullscreen"]].forEach(([k, label]) => {
    const l = document.createElement("label"); l.style.cssText = "display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:14px";
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = S[k];
    c.onchange = () => { S[k] = c.checked; save(); if (k === "debug") startDbg(); if (k === "showPaths") renderList(); };
    l.append(c, label); dv.appendChild(l);
  });

  const sc = sec("Site controls"), bb = document.createElement("div"); bb.className = "dbtns"; sc.appendChild(bb);
  btn(bb, "Save offline now", async () => { await autoOffline([...allApps(), ...SECRET_APPS]); refresh(); });
  btn(bb, "Clear offline copies", async () => { if (!confirm("Delete all saved offline copies?")) return; for (const k of await caches.keys()) await caches.delete(k); refresh(); });
  btn(bb, "Reset offline worker", async () => { if (!confirm("Remove the offline worker and all saved copies?")) return; try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); for (const k of await caches.keys()) await caches.delete(k); } catch (e) {} refresh(); });
  btn(bb, "Reload site", () => location.reload());
  btn(bb, "Reset settings", () => { S = freshS(); save(); buildControls(); apply(); startDbg(); });
  btn(bb, "Clear all saved data", () => { if (!confirm("Clear every setting this site saved on this device?")) return; try { localStorage.removeItem(KEY); } catch (e) {} S = freshS(); buildControls(); apply(); startDbg(); });
  btn(bb, "Lock now", () => setSecret(false));

  const lk = sec("App links"), res = document.createElement("div"); res.className = "dlog"; res.textContent = "Not checked yet.";
  btn(lk, "Check all app links", async () => {
    res.textContent = "Checking..."; const out = [];
    for (const g of [...allApps(), ...SECRET_APPS]) {
      try { const r = await fetch(g.path + (g.path.includes("?") ? "&" : "?") + "nocache=" + Date.now(), {method: "HEAD", cache: "no-store"}); out.push((r.ok ? "OK    " : "FAIL  ") + r.status + "  " + g.path); }
      catch (e) { out.push("ERR   " + g.path + "  (blocked or offline)"); }
    }
    res.textContent = out.join("\n");
  });
  lk.appendChild(res);

  const lg = sec("Error log"), lb = document.createElement("div"); lb.className = "dlog";
  lb.textContent = logs.length ? logs.join("\n") : "No errors recorded this session.";
  const lbt = document.createElement("div"); lbt.className = "dbtns"; lg.appendChild(lbt);
  btn(lbt, "Clear log", () => { logs.length = 0; lb.textContent = "No errors recorded this session."; });
  btn(lbt, "Copy settings", () => { try { navigator.clipboard.writeText(JSON.stringify(S, null, 2)); } catch (e) {} });
  lg.appendChild(lb);
}

let clkT = null;
const clockTick = () => {
  const d = new Date(), o = {hour: "numeric", minute: "2-digit", hour12: !S.clock24}; if (S.clockSeconds) o.second = "2-digit";
  $("clk").textContent = (S.clockDate ? d.toLocaleDateString([], {month: "short", day: "numeric"}) + "  " : "") + d.toLocaleTimeString([], o);
};

loadPlayCache(); buildControls(); apply(); startDbg(); scanPlayables(false);
if (S.autoOpenLast && S.lastApp) { const la = allApps().find(a => a.path === S.lastApp); if (la) openApp(la); }
</script>
</body>
</html>
