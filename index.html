<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GaimOS — katastrophy edition</title>

<style>
  body {
    margin: 0;
    background: #000;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: #ccc;
  }

  /* BOOT SCREEN */
  #bootScreen {
    position: fixed;
    width: 100vw;
    height: 100vh;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  #bootLogo {
    font-size: 60px;
    color: #b30000;
  }

  #devBtn {
    margin-top: 30px;
    padding: 10px 20px;
    background: #222;
    border: 2px solid #b30000;
    color: #ccc;
    cursor: pointer;
    font-size: 16px;
  }

  #devBtn:hover {
    background: #333;
  }

  /* PIN PAD */
  #pinPad {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #1a1a1a;
    border: 2px solid #b30000;
    padding: 20px;
    text-align: center;
    box-shadow: 0 0 20px #000;
    z-index: 9999;
  }

  #pinDisplay {
    width: 150px;
    height: 40px;
    background: #111;
    border: 1px solid #333;
    color: #ccc;
    margin: 10px auto;
    font-size: 20px;
    text-align: center;
    line-height: 40px;
  }

  .pinBtn {
    width: 50px;
    height: 50px;
    background: #222;
    border: 1px solid #b30000;
    color: #ccc;
    font-size: 20px;
    margin: 5px;
    cursor: pointer;
    display: inline-block;
    line-height: 50px;
  }

  .pinBtn:hover {
    background: #333;
  }

  /* DESKTOP */
  #desktop {
    display: none;
    width: 100vw;
    height: 100vh;
    background: #0f0f0f;
    position: relative;
  }

  /* DRAGGABLE ICONS */
  .app-icon {
    width: 60px;
    text-align: center;
    cursor: pointer;
    position: absolute;
  }

  .app-box {
    width: 40px;
    height: 40px;
    background: #222;
    border: 2px solid #b30000;
    margin: 0 auto 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b30000;
    font-weight: bold;
    font-size: 20px;
  }

  /* WINDOW */
  .window {
    position: absolute;
    width: 600px;
    height: 400px;
    background: #1a1a1a;
    border: 2px solid #b30000;
    box-shadow: 0 0 15px #000;
    display: none;
    flex-direction: column;
    resize: both;
    overflow: hidden;
  }

  .window-header {
    background: #222;
    padding: 8px;
    color: #fff;
    display: flex;
    justify-content: space-between;
    cursor: move;
  }

  .close-btn {
    background: #b30000;
    padding: 3px 8px;
    cursor: pointer;
  }

  .window-body {
    flex: 1;
    background: #111;
  }

  /* TASKBAR */
  #taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 40px;
    width: 100%;
    background: #111;
    border-top: 2px solid #b30000;
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  #devIcon {
    background:#222;
    border:2px solid #b30000;
    padding:5px 12px;
    cursor:pointer;
    color:#ccc;
    margin-left:10px;
  }

  #clock {
    margin-left: auto;
    margin-right: 15px;
    font-size: 14px;
    color: #ccc;
  }

  /* DEV PANEL */
  #devPanel {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 250px;
    background: #1a1a1a;
    border: 2px solid #b30000;
    padding: 10px;
    display: none;
  }

  #devPanel h3 {
    margin-top: 0;
    color: #b30000;
  }

  .dev-toggle {
    margin: 10px 0;
    padding: 8px;
    background: #222;
    border: 1px solid #b30000;
    cursor: pointer;
  }

  .dev-toggle:hover {
    background: #333;
  }
</style>

<script>
  let devMode = false;
  let pinInput = "";

  /* BOOT ALWAYS ENDS AFTER 1 SECOND + PIN PAD FLASH */
  window.onload = () => {

    // Flash PIN pad open for 150ms
    document.getElementById("pinPad").style.display = "block";
    setTimeout(() => {
      document.getElementById("pinPad").style.display = "none";
    }, 150);

    // Finish boot
    setTimeout(() => {
      document.getElementById("bootScreen").style.display = "none";
      document.getElementById("desktop").style.display = "block";

      if (devMode) {
        document.getElementById("devPanel").style.display = "block";
      }
    }, 1000);
  };

  /* DEV ICON OPENS PIN PAD */
  function openDevPad() {
    document.getElementById("pinPad").style.display = "block";
  }

  /* DEV MODE PIN PAD */
  function enableDev() {
    document.getElementById("pinPad").style.display = "block";
  }

  function pressNum(n) {
    if (pinInput.length < 4) {
      pinInput += n;
      document.getElementById("pinDisplay").innerText = pinInput;
    }

    if (pinInput.length === 4) {
      if (pinInput === "8692") {
        devMode = true;
        document.getElementById("pinPad").style.display = "none";
        document.getElementById("devPanel").style.display = "block";
      } else {
        pinInput = "";
        document.getElementById("pinDisplay").innerText = "WRONG";
        setTimeout(() => {
          document.getElementById("pinDisplay").innerText = "";
        }, 800);
      }
    }
  }

  /* CLOCK */
  function updateClock() {
    const now = new Date();
    document.getElementById("clock").innerText =
      now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  }
  setInterval(updateClock, 1000);
  updateClock();

  /* OPEN WINDOW */
  function openWindow(appName, filePath) {
    const win = document.getElementById("mainWindow");
    win.style.display = "flex";
    document.getElementById("windowTitle").innerText = appName;
    document.getElementById("windowFrame").src = filePath;
  }

  function closeWindow() {
    document.getElementById("mainWindow").style.display = "none";
  }

  /* AUTO-LOAD APPS */
  const apps = [
    "Calculator.html",
    "Notes.html",
    "Viewer.html"
  ];

  window.addEventListener("DOMContentLoaded", () => {
    const desktop = document.getElementById("desktop");

    apps.forEach((file, i) => {
      const name = file.replace(".html", "");

      /* ICON */
      const icon = document.createElement("div");
      icon.className = "app-icon";
      icon.style.left = (20 + i * 80) + "px";
      icon.style.top = "20px";
      icon.innerHTML = `
        <div class="app-box">${name[0]}</div>
        <span>${name}</span>
      `;
      icon.onclick = () => openWindow(name, "/repo/apps/" + file);

      /* DRAGGABLE ICON */
      icon.onmousedown = function(e) {
        let shiftX = e.clientX - icon.getBoundingClientRect().left;
        let shiftY = e.clientY - icon.getBoundingClientRect().top;

        function moveAt(pageX, pageY) {
          icon.style.left = pageX - shiftX + "px";
          icon.style.top = pageY - shiftY + "px";
        }

        function onMouseMove(e) {
          moveAt(e.pageX, e.pageY);
        }

        document.addEventListener('mousemove', onMouseMove);
        icon.onmouseup = () => {
          document.removeEventListener('mousemove', onMouseMove);
        };
      };

      desktop.appendChild(icon);
    });
  });

  /* DRAGGABLE WINDOW */
  let isDragging = false;
  let offsetX, offsetY;

  function startDrag(e) {
    const win = document.getElementById("mainWindow");
    isDragging = true;
    offsetX = e.clientX - win.offsetLeft;
    offsetY = e.clientY - win.offsetTop;
  }

  function drag(e) {
    if (!isDragging) return;
    const win = document.getElementById("mainWindow");
    win.style.left = (e.clientX - offsetX) + "px";
    win.style.top = (e.clientY - offsetY) + "px";
  }

  function stopDrag() {
    isDragging = false;
  }

  document.addEventListener("mousemove", drag);
  document.addEventListener("mouseup", stopDrag);
</script>

</head>
<body>

<!-- BOOT -->
<div id="bootScreen">
  <div id="bootLogo">katastrophy</div>
  <div id="devBtn" onclick="enableDev()">DEV MODE</div>
</div>

<!-- PIN PAD -->
<div id="pinPad">
  <div id="pinDisplay"></div>
  <div>
    <div class="pinBtn" onclick="pressNum('1')">1</div>
    <div class="pinBtn" onclick="pressNum('2')">2</div>
    <div class="pinBtn" onclick="pressNum('3')">3</div>
  </div>
  <div>
    <div class="pinBtn" onclick="pressNum('4')">4</div>
    <div class="pinBtn" onclick="pressNum('5')">5</div>
    <div class="pinBtn" onclick="pressNum('6')">6</div>
  </div>
  <div>
    <div class="pinBtn" onclick="pressNum('7')">7</div>
    <div class="pinBtn" onclick="pressNum('8')">8</div>
    <div class="pinBtn" onclick="pressNum('9')">9</div>
  </div>
  <div>
    <div class="pinBtn" onclick="pressNum('0')">0</div>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop">

  <!-- DEV PANEL -->
  <div id="devPanel">
    <h3>Dev Controls</h3>
    <div class="dev-toggle">Toggle Experimental UI</div>
    <div class="dev-toggle">Enable Debug Overlay</div>
    <div class="dev-toggle">Force Reload Apps</div>
  </div>

  <!-- WINDOW -->
  <div id="mainWindow" class="window">
    <div class="window-header" onmousedown="startDrag(event)">
      <span id="windowTitle">App</span>
      <div class="close-btn" onclick="closeWindow()">X</div>
    </div>
    <div class="window-body">
      <iframe id="windowFrame" style="width:100%;height:100%;border:none;"></iframe>
    </div>
  </div>

  <!-- TASKBAR -->
  <div id="taskbar">
    <div id="devIcon" onclick="openDevPad()">DEV</div>
    <div id="clock"></div>
  </div>

</div>

</body>
</html>
