<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playable Desktop</title>
<style>
    body {
        margin: 0;
        background: #2b2b2b;
        font-family: "Segoe UI", sans-serif;
        color: #ddd;
        user-select: none;
        overflow: hidden;
    }

    #desktop {
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-columns: repeat(auto-fill, 120px);
        grid-auto-rows: 120px;
        gap: 20px;
        padding: 20px;
        box-sizing: border-box;
    }

    .icon {
        background: #3a3a3a;
        border: 2px solid #555;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.1s;
    }

    .icon:hover {
        background: #4a4a4a;
        border-color: #777;
    }

    .icon span {
        margin-top: 8px;
        font-size: 13px;
        text-align: center;
        word-break: break-word;
    }

    /* Drag overlay */
    #dropzone {
        position: fixed;
        inset: 0;
        background: rgba(80,80,80,0.7);
        border: 4px dashed #aaa;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #ccc;
        z-index: 10;
    }
</style>
</head>
<body>

<div id="dropzone">Drop files to add new units</div>
<div id="desktop">Loading…</div>

<script>
const UNITS_PATH = "REPO/activities/"; // renamed from games

async function loadUnits() {
    const desktop = document.getElementById("desktop");

    try {
        const response = await fetch(UNITS_PATH);
        const text = await response.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(text, "text/html");

        const folders = [...doc.querySelectorAll("a")]
            .map(a => a.getAttribute("href"))
            .filter(h => h && !h.includes(".") && h !== "../");

        desktop.innerHTML = "";

        folders.forEach(folder => {
            const icon = document.createElement("div");
            icon.className = "icon";

            icon.innerHTML = `
                <div style="width:40px;height:40px;background:#777;border:2px solid #999;"></div>
                <span>${folder.replace("/", "")}</span>
            `;

            icon.onclick = () => {
                window.location.href = `${UNITS_PATH}${folder}/index.html`;
            };

            desktop.appendChild(icon);
        });

    } catch (err) {
        desktop.innerHTML = "Failed to load units.";
        console.error(err);
    }
}

loadUnits();

/* Drag & Drop Overlay */
const dropzone = document.getElementById("dropzone");

window.addEventListener("dragenter", () => dropzone.style.display = "flex");
window.addEventListener("dragleave", () => dropzone.style.display = "none");
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
    e.preventDefault();
    dropzone.style.display = "none";
    alert("Dropped files — upload handling not implemented yet.");
});
</script>

</body>
</html>
